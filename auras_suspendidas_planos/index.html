<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Simulador - Instalación Suspendida Flotante</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="ui">
  <div class="obra-title">Instalación: Auras Suspendidas</div>

  <details open>
    <summary>Controles</summary>
    
    <div class="config-content">
      <p><b>Navegación:</b> Clic izq. (rotar) | Clic der. (arrastrar) | Rueda (zoom).</p>
      
      <button id="toggleThemeBtn" class="btn">Cambiar a Modo Claro</button>
      <button id="toggleCotasBtn" class="btn">Mostrar / Ocultar Medidas</button>

      <div class="slider-container">
        <label for="zoomSlider">Zoom de Cámara:</label>
        <input type="range" id="zoomSlider" min="2" max="15" step="0.1" value="8.5">
      </div>

      <div class="slider-container">
        <label for="lightSlider">Intensidad Proyectores:</label>
        <input type="range" id="lightSlider" min="0.1" max="5.0" step="0.1" value="1.0">
      </div>
    </div>
  </details>
</div>

<div id="canvas-container"></div>

<script src="script.js" defer></script>
</body>
</html>
